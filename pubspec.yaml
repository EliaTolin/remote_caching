name: remote_caching
description: "A Flutter package for caching remote API calls with configurable duration."
version: 1.0.19
repository: https://github.com/eliatolin/remote_caching
issue_tracker: https://github.com/eliatolin/remote_caching/issues
topics:
  - network
  - http
  - caching
  - remote
  - web

screenshots:
  - description: 'Remote caching logo.'
    path: assets/logo.png

platforms:
  android:
  ios:
  macos:
  linux:
  windows:
  web:

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  sqflite_common: ^2.5.6
  sqflite_common_ffi: ^2.4.0
  sqflite_common_ffi_web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^9.0.0
