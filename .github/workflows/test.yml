name: Test

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'bin/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'example/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'bin/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'
      - 'example/**'
      - '.github/workflows/test.yml'
jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Run analyzer
        run: flutter analyze

  test:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --concurrency=1

  test-web:
    name: Test (Web)
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Generate sqlite3.wasm and sqflite_sw.js for the web tests
        run: dart run sqflite_common_ffi_web:setup --dir test

      - name: Run tests in Chrome (dart2js)
        run: flutter test --platform chrome --concurrency=1

      - name: Run tests in Chrome (dart2wasm)
        run: flutter test --platform chrome --wasm --concurrency=1

  coverage:
    name: Code Coverage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flutter-actions/setup-flutter@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Code Coverage
        run: flutter test  --concurrency=1 --coverage --coverage-path lcov.info
      - name: Upload Coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          slug: EliaTolin/remote_caching